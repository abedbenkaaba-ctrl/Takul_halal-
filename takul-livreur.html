<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TA'KUL HALAL — Livreur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  :root { --green:#0B3D2E; --gold:#C9A227; --cream:#F7F5EF; --ink:#1A1A1A; --mute:#6B7568; --chip:#E8EFE8; }
  * { box-sizing:border-box; } body { margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); }
  .serif { font-family:'Fraunces',serif; }
  .wrap { max-width:480px; margin:0 auto; }
  .header { background:var(--green); color:white; padding:16px; display:flex; justify-content:space-between; align-items:center; }
  select { background:transparent; border:none; color:white; font-size:12px; }
  .card { background:white; border:1px solid #EDEAE0; border-radius:16px; margin:16px; overflow:hidden; }
  .card .head { padding:14px; background:var(--cream); display:flex; justify-content:space-between; }
  .card .body { padding:14px; }
  .maplinks { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .maplinks a { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; border-radius:12px; color:white; text-decoration:none; font-size:12px; font-weight:500; }
  .gmaps { background:#1a73e8; } .waze { background:#33ccff; }
  .btn { width:100%; padding:12px; border:none; border-radius:12px; background:var(--green); color:white; font-weight:600; font-size:14px; margin-top:8px; }
  .empty { font-style:italic; color:var(--mute); text-align:center; padding:24px; border:1px dashed #EDEAE0; border-radius:16px; margin:0 16px 12px; }
  .pool-item { background:white; border:1px solid #EDEAE0; border-radius:16px; padding:14px; margin:0 16px 8px; display:flex; justify-content:space-between; align-items:center; }
  .acceptbtn { background:var(--green); color:white; border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:500; }
  .toggle { width:36px; height:20px; border-radius:999px; background:rgba(255,255,255,.3); position:relative; }
  .toggle.on { background: var(--gold); }
  .toggle .dot { width:16px; height:16px; border-radius:999px; background:white; position:absolute; top:2px; left:2px; transition:.2s; }
  .toggle.on .dot { left:18px; }
  .name-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .name-box { max-width:340px; width:100%; background:white; border:1px solid #EDEAE0; border-radius:16px; padding:24px; text-align:center; }
  input { width:100%; padding:12px; border:1px solid #EDEAE0; border-radius:12px; font-size:14px; margin:12px 0; }
</style>
</head>
<body>

<div id="nameScreen" class="name-screen">
  <div class="name-box">
    <div class="serif" style="font-size:20px;">Bienvenue, livreur</div>
    <div style="color:var(--mute);font-size:12px;">Entre ton nom pour commencer</div>
    <input id="nameInput" placeholder="Ton nom" />
    <button class="btn" onclick="startSession()">Commencer</button>
  </div>
</div>

<div id="app" class="wrap" style="display:none;">
  <div class="header">
    <div>
      <div id="statusLabel" style="font-size:14px;font-weight:500;">En attente</div>
      <select id="citySelect" onchange="onCityChange()"><option>Lyon</option><option>Paris</option><option>Marseille</option></select>
    </div>
    <div onclick="toggleAvailable()" style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;">
      Disponible <div id="availToggle" class="toggle on"><div class="dot"></div></div>
    </div>
  </div>
  <div id="activeCard"></div>
  <div style="font-weight:500;font-size:14px;margin:16px;" id="poolTitle">Commandes disponibles à Lyon</div>
  <div id="poolList"></div>
</div>

<script>
const API_BASE = "https://appli-delivery-halal-production.up.railway.app";
let city = "Lyon"; let driverName = ""; let active = null; let deliveredCount = 0; let available = true; let pollTimer = null;

function startSession() {
  driverName = document.getElementById('nameInput').value.trim();
  if (!driverName) return;
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('statusLabel').textContent = driverName;
  pollTimer = setInterval(loadPool, 3000);
  loadPool();
}

function onCityChange() { city = document.getElementById('citySelect').value; document.getElementById('poolTitle').textContent = 'Commandes disponibles à ' + city; loadPool(); }

function toggleAvailable() {
  available = !available;
  document.getElementById('availToggle').className = 'toggle' + (available ? ' on' : '');
}

function googleMapsUrl(addr) { return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}`; }
function wazeUrl(addr) { return `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`; }

async function loadPool() {
  const res = await fetch(`${API_BASE}/api/cities/${city}/pool`);
  const pool = await res.json();
  renderPool(pool.filter(o => !active || o.id !== active.id));
}

function renderPool(pool) {
  const el = document.getElementById('poolList');
  if (!pool.length) { el.innerHTML = '<div class="empty">Aucune commande prête pour le moment.</div>'; return; }
  el.innerHTML = pool.map(o => `
    <div class="pool-item">
      <div><div style="font-size:14px;font-weight:500;">${o.restaurant_name}</div><div style="font-size:11px;color:var(--mute);">${o.address}</div></div>
      <button class="acceptbtn" onclick='accept(${JSON.stringify(o).replace(/'/g,"&apos;")})'>Accepter</button>
    </div>`).join('');
}

async function accept(order) {
  const res = await fetch(`${API_BASE}/api/orders/${order.id}/accept`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ driver_id: driverName, driver_name: driverName })
  });
  active = await res.json();
  renderActive();
  loadPool();
  document.getElementById('statusLabel').textContent = 'En livraison';
}

function renderActive() {
  const el = document.getElementById('activeCard');
  if (!active) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="card">
      <div class="head"><div><div style="font-size:14px;font-weight:500;">Commande #${active.id}</div><div style="font-size:11px;color:var(--mute);">${active.restaurant_name}</div></div><b style="color:var(--green);">${Number(active.total).toFixed(2)} €</b></div>
      <div class="body">
        <div style="font-size:14px;font-weight:500;">Adresse du client</div>
        <div style="font-size:12px;color:var(--mute);margin-bottom:8px;">${active.address}</div>
        <div class="maplinks">
          <a class="gmaps" href="${googleMapsUrl(active.address)}" target="_blank">🧭 Google Maps</a>
          <a class="waze" href="${wazeUrl(active.address)}" target="_blank">🧭 Waze</a>
        </div>
        <button class="btn" onclick="deliver()">J'ai livré la commande</button>
      </div>
    </div>`;
}

async function deliver() {
  await fetch(`${API_BASE}/api/orders/${active.id}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'livree'}) });
  deliveredCount++;
  active = null;
  renderActive();
  document.getElementById('statusLabel').textContent = driverName;
  loadPool();
}
</script>
</body>
</html>
